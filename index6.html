<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video UI</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --panel2: #202020;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #ff0000;
      --border: #303030;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(15,15,15,0.96);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .search {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .search input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #121212;
      color: var(--text);
      outline: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) 420px;
      gap: 16px;
      padding: 16px;
    }

    .player-card, .side-card, .video-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .player-wrap {
      padding: 12px;
    }

    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 14px;
    }

    .meta {
      padding: 12px 4px 4px;
    }

    .meta h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .meta p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .side-card {
      padding: 12px;
      height: fit-content;
    }

    .side-card h2 {
      margin: 4px 0 12px;
      font-size: 16px;
    }

    .video-list {
      display: grid;
      gap: 12px;
    }

    .video-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }

    .video-item:hover {
      transform: translateY(-1px);
      background: var(--panel2);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 10px;
    }

    .info h3 {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.3;
    }

    .info .channel {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .info .desc {
      margin: 0;
      color: #cfcfcf;
      font-size: 12px;
      line-height: 1.4;
    }

    .loading {
      padding: 20px;
      color: var(--muted);
    }

    @media (max-width: 1000px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#"><span>►</span> VideoUI</a>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Buscar videos..." />
    </div>
  </header>

  <main class="layout">
    <section class="player-card">
      <div class="player-wrap">
        <video id="videoPlayer" controls playsinline autoplay></video>
        <div class="meta">
          <h1 id="title">Cargando...</h1>
          <p id="channel"></p>
          <p id="description"></p>
        </div>
      </div>
    </section>

    <aside class="side-card">
      <h2>Videos</h2>
      <div id="videoList" class="video-list">
        <div class="loading">Cargando lista...</div>
      </div>
    </aside>
  </main>

  <script>
    const API_BASE = "https://miapp.onrender.com";

    const videoPlayer = document.getElementById("videoPlayer");
    const titleEl = document.getElementById("title");
    const channelEl = document.getElementById("channel");
    const descriptionEl = document.getElementById("description");
    const videoList = document.getElementById("videoList");
    const searchInput = document.getElementById("searchInput");

    let allVideos = [];
    let currentId = new URLSearchParams(location.search).get("v") || "M7lc1UVf-VE";

    function setCurrentVideo(video) {
      currentId = video.id;
      titleEl.textContent = video.title;
      channelEl.textContent = video.channel;
      descriptionEl.textContent = video.description;
      videoPlayer.src = `${API_BASE}/stream?id=${encodeURIComponent(video.id)}`;
      videoPlayer.play().catch(() => {});
      history.replaceState({}, "", `?v=${encodeURIComponent(video.id)}`);
    }

    function renderList(items) {
      if (!items.length) {
        videoList.innerHTML = `<div class="loading">No hay resultados.</div>`;
        return;
      }

      videoList.innerHTML = items.map(video => `
        <article class="video-item" data-id="${video.id}">
          <img class="thumb" src="${video.thumbnail}" alt="${video.title}">
          <div class="info">
            <h3>${video.title}</h3>
            <p class="channel">${video.channel}</p>
            <p class="desc">${video.description}</p>
          </div>
        </article>
      `).join("");

      videoList.querySelectorAll(".video-item").forEach(card => {
        card.addEventListener("click", () => {
          const video = allVideos.find(v => v.id === card.dataset.id);
          if (video) setCurrentVideo(video);
        });
      });
    }

    async function loadVideos() {
      try {
        const res = await fetch(`${API_BASE}/api/videos`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allVideos = await res.json();

        const initial = allVideos.find(v => v.id === currentId) || allVideos[0];
        if (initial) setCurrentVideo(initial);

        renderList(allVideos);
      } catch (err) {
        videoList.innerHTML = `<div class="loading">Error cargando videos: ${err.message}</div>`;
      }
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allVideos.filter(v =>
        v.title.toLowerCase().includes(q) ||
        v.channel.toLowerCase().includes(q) ||
        v.description.toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    loadVideos();
  </script>
</body>
</html>
