<!-- index.html (cargado en about:blank) -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor YouTube sin iframe</title>
</head>
<body>
  <h2>Reproductor personalizado (sin &lt;iframe&gt;)</h2>
  <video id="videoPlayer" width="640" height="360" controls>
    <!-- Fuente se asignará dinámicamente -->
    Tu navegador no soporta video HTML5.
  </video>

  <script>
    // ID del video de YouTube que se desea reproducir
    const videoId = 'M7lc1UVf-VE'; // ejemplo: video de demostración
    // URL de la ruta /stream en el servidor
    const serverUrl = `https://miapp.onrender.com/stream?id=${videoId}`;

    // Obtener el elemento <video> y asignar la fuente
    const videoElem = document.getElementById('videoPlayer');
    videoElem.src = serverUrl;
    // Agregar atributo CORS si fuese necesario
    videoElem.crossOrigin = "anonymous";

    // Opcional: manejar errores de reproducción
    videoElem.addEventListener('error', (e) => {
      console.error('Error al reproducir el video:', e);
    });
  </script>
</body>
</html>
