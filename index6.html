<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MyTube</title>
</head>

<body>

<button id="openBtn">
Abrir reproductor
</button>

<script>
document.getElementById("openBtn").onclick = () => {

    const w = window.open("about:blank");

    w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
    <title>Player</title>

    <style>
    body{
        margin:0;
        background:black;
        overflow:hidden;
    }

    video{
        width:100vw;
        height:100vh;
        object-fit:contain;
        background:black;
    }
    </style>

    </head>

    <body>

    <video controls autoplay>
        <source src="video.mp4" type="video/mp4">
    </video>

    </body>
    </html>
    `);

};
</script>

</body>
</html>
