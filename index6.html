<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Vídeos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h2, h3, p {
            margin-top: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #222;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #player-container {
            margin-bottom: 20px;
            display: none;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        .video-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .video-item:hover {
            transform: translateY(-1px);
            background: #262626;
        }

        .video-item img {
            width: 120px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .video-info h4 {
            margin: 0 0 6px 0;
        }

        .video-info p {
            margin: 0;
            color: #bdbdbd;
            font-size: 14px;
        }

        .error {
            background: #3a1111;
            color: #ffb3b3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .hint {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Buscador de Vídeos</h2>
    <p class="hint">Escribe una búsqueda y carga resultados de YouTube.</p>

    <div class="search-box">
        <input type="text" id="query" placeholder="Busca un vídeo..." autocomplete="off">
        <button id="buscarBtn">Buscar</button>
    </div>

    <div id="errorBox" class="error"></div>

    <div id="player-container">
        <h3 id="current-title">Reproduciendo</h3>
        <video id="reproductor" controls autoplay></video>
    </div>

    <div id="resultados"></div>

    <script>
        // Pon tu API key aquí
        const YOUTUBE_API_KEY = "AIzaSyCrTcQsNhpTVUkcnyfWkwZmFvdNpVbc8M4";

        // Si tu servidor proxy funciona, deja esta URL; si no, tendrás que cambiarla o quitar la parte de reproducir
        const PROXY_SERVER_URL = "https://youtube-unblocked-for-ultron-games.onrender.com";

        const queryInput = document.getElementById("query");
        const buscarBtn = document.getElementById("buscarBtn");
        const resultados = document.getElementById("resultados");
        const errorBox = document.getElementById("errorBox");

        buscarBtn.addEventListener("click", buscarVideos);
        queryInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") buscarVideos();
        });

        function mostrarError(mensaje) {
            errorBox.textContent = mensaje;
            errorBox.style.display = "block";
        }

        function limpiarError() {
            errorBox.textContent = "";
            errorBox.style.display = "none";
        }

        async function buscarVideos() {
            const query = queryInput.value.trim();
            limpiarError();
            resultados.innerHTML = "";

            if (!query) {
                mostrarError("Escribe algo para buscar.");
                return;
            }

            if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "TU_API_KEY") {
                mostrarError("Pon una API key válida en YOUTUBE_API_KEY.");
                return;
            }

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) {
                    const message = data?.error?.message || `Error HTTP ${res.status}`;
                    throw new Error(message);
                }

                mostrarResultados(data.items || []);
            } catch (err) {
                console.error("Fallo de red:", err);
                mostrarError(`No se pudo buscar vídeos: ${err.message}`);
            }
        }

        function mostrarResultados(items) {
            resultados.innerHTML = "";

            if (!items.length) {
                resultados.innerHTML = "<p>No se encontraron vídeos.</p>";
                return;
            }

            items.forEach((item) => {
                if (!item.id || !item.id.videoId) return;

                const titulo = item.snippet?.title || "Sin título";
                const canal = item.snippet?.channelTitle || "Canal desconocido";
                const thumb = item.snippet?.thumbnails?.medium?.url || item.snippet?.thumbnails?.default?.url || "";

                const div = document.createElement("div");
                div.className = "video-item";
                div.onclick = () => reproducirVideo(item.id.videoId, titulo);

                div.innerHTML = `
                    <img src="${thumb}" alt="Miniatura de ${titulo}">
                    <div class="video-info">
                        <h4>${titulo}</h4>
                        <p>${canal}</p>
                    </div>
                `;

                resultados.appendChild(div);
            });
        }

        async function reproducirVideo(videoId, titulo) {
            document.getElementById("player-container").style.display = "block";
            document.getElementById("current-title").innerText = titulo;

            const videoUrl = `${PROXY_SERVER_URL}/stream?id=${videoId}`;
            const videoElement = document.getElementById("reproductor");

            try {
                limpiarError();

                const response = await fetch(videoUrl, { method: "HEAD" });

                if (!response.ok) {
                    throw new Error(`Proxy no disponible (HTTP ${response.status})`);
                }

                videoElement.src = videoUrl;
                videoElement.load();

                videoElement.play().catch(() => {
                    mostrarError("Haz clic en play para iniciar el vídeo.");
                });
            } catch (error) {
                console.error("Error del proxy:", error);
                mostrarError(`No se pudo cargar el vídeo: ${error.message}`);
                document.getElementById("player-container").style.display = "none";
            }
        }
    </script>
</body>
</html>
