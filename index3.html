<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Temporal Correcto</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; max-width: 800px; margin: 0 auto; padding: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: none; background: #222; color: white; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #player-container { margin-bottom: 20px; display: none; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .video-item { display: flex; gap: 15px; margin-bottom: 15px; background: #1e1e1e; padding: 10px; border-radius: 6px; cursor: pointer; }
        .video-item img { width: 120px; border-radius: 4px; }
        .video-info h4 { margin: 0 0 5px 0; }
    </style>
</head>
<body>

    <h2>Buscador de Vídeos</h2>
    <div class="search-box">
        <input type="text" id="query" placeholder="Busca un vídeo...">
        <button onclick="buscarVideos()">Buscar</button>
    </div>

    <div id="player-container">
        <h3 id="current-title">Reproduciendo</h3>
        <video id="reproductor" controls autoplay></video>
    </div>

    <div id="resultados"></div>

    <script>
        // CONFIGURACIÓN (Introduce tus datos correctos aquí)
        const YOUTUBE_API_KEY = "AIzaSyCrTcQsNhpTVUkcnyfWkwZmFvdNpVbc8M4"; 
        const PROXY_SERVER_URL = "https://youtube-unblocked-for-ultron-games.onrender.com"; 

        async function buscarVideos() {
            const query = document.getElementById('query').value;
            if(!query) return;

            // Formato limpio que el navegador construye de forma automática y perfecta
            const parametros = new URLSearchParams({
                part: 'snippet',
                maxResults: '5',
                q: query,
                type: 'video',
                key: YOUTUBE_API_KEY
            });

            const url = "https://googleapis.com?" + parametros.toString();
            
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    const errorData = await res.json();
                    console.error("Error detallado de Google:", errorData);
                    alert("Error de la API de Google. Revisa la consola F12 para ver el motivo.");
                    return;
                }
                const data = await res.json();
                mostrarResultados(data.items);
            } catch (err) {
                console.error("Fallo de red:", err);
                alert("Error de conexión. Revisa tu código.");
            }
        }

        function mostrarResultados(items) {
            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '';
            
            if(!items || items.length === 0) {
                contenedor.innerHTML = '<p>No se encontraron vídeos.</p>';
                return;
            }
            
            items.forEach(item => {
                if(!item.id || !item.id.videoId) return;
                
                const div = document.createElement('div');
                div.className = 'video-item';
                div.onclick = () => reproducirVideo(item.id.videoId, item.snippet.title);
                div.innerHTML = `
                    <img src="${item.snippet.thumbnails.medium.url}">
                    <div class="video-info">
                        <h4>${item.snippet.title}</h4>
                        <p>${item.snippet.channelTitle}</p>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        function reproducirVideo(videoId, titulo) {
            document.getElementById('player-container').style.display = 'block';
            document.getElementById('current-title').innerText = titulo;
            
            const videoElement = document.getElementById('reproductor');
            videoElement.src = `${PROXY_SERVER_URL}/stream?id=${videoId}`;
            videoElement.load();
            videoElement.play().catch(e => console.log("Esperando interacción del usuario..."));
        }
    </script>
</body>
</html>
